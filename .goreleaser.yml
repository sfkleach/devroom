project_name: devroom

before:
  hooks:
    - go mod tidy

builds:
  - id: devroom
    binary: devroom
    main: ./cmd/devroom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Tag}}

archives:
  - id: devroom-archive
    format: tar.gz
    name_template: "devroom_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

# Not "changelog: disable: true": that also discards the file passed via
# --release-notes (see release.yml), rendering an empty release body
# regardless. The release workflow always passes --release-notes, which
# already skips GoReleaser's own commit-based changelog generation.

release:
  github:
    owner: sfkleach
    name: devroom
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
